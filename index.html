<style>
:root { --bg:#F6F4F0; --surface:#FFFFFF; --text:#2B2825; --muted:#6B655E; --line:#E2DED7; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#131210; --surface:#1C1A18; --text:#ECE8E2; --muted:#A8A199; --line:#2E2B28; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--text);
  font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }
header.site { display:flex; align-items:center; gap:10px; margin-bottom:40px; }
header.site a { color:var(--text); text-decoration:none; font-weight:600; }
.mark { width:28px; height:28px; fill:var(--text); }
h1 { font-family: ui-serif, "Apple Myungjo", "Noto Serif KR", serif; font-weight:600; font-size:32px; line-height:1.3; letter-spacing:-0.01em; margin:0 0 16px; }
h2 { font-size:19px; margin:40px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
h3 { font-size:16px; margin:28px 0 4px; }
p, li { color:var(--text); }
ul { padding-left: 20px; }
a { color: var(--text); text-underline-offset: 3px; }
nav.links { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
nav.links a { display:inline-block; padding:12px 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); text-decoration:none; }
footer { margin-top:56px; color:var(--muted); font-size:13px; }
.lead { font-size:18px; color:var(--muted); }
</style></head>

<h1>난포일기</h1>
<p class="lead">난임 치료 중 처방받은 주사를 제때 알려 드리고, 그날의 몸과 마음을 함께 적어 두는 다이어리예요.</p>
<p>계정도, 로그인도, 서버도 없어요. 적으신 기록은 이 휴대폰에만 남아요.
앱은 용량이나 시각을 정해 드리지 않고, 수치를 해석하지 않아요. 약과 몸에 관한 것은 늘 담당 의료진의 안내가 먼저예요.</p>
